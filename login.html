
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <title>Member Login | REAL WEALTH EDGE</title>
  <style>
    :root {
      --gold: #d8b45a;
      --gold-light: #f4d98a;
      --bg: #0b0b0b;
      --panel: #151515;
      --muted: #b9b9b9;
      --border: #333;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #242016 0, var(--bg) 48%);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 22px 18px;
      text-align: center;
      border-bottom: 1px solid #29251b;
    }

    .brand {
      color: var(--gold-light);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .tagline {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
    }

    main {
      width: 100%;
      max-width: 460px;
      margin: auto;
      padding: 35px 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid #383124;
      border-radius: 16px;
      padding: 28px 23px;
      box-shadow: 0 16px 50px #0008;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 27px;
    }

    .intro {
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 26px;
    }

    label {
      display: block;
      font-size: 13px;
      margin: 17px 0 8px;
      color: #eee;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0d0d0d;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
    }

    .password-wrap {
      display: flex;
      gap: 8px;
    }

    .password-wrap input {
      min-width: 0;
      flex: 1;
    }

    .show-password {
      background: #29251b;
      color: var(--gold-light);
      border: 1px solid #51452a;
      border-radius: 8px;
      padding: 0 12px;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #111;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary:disabled {
      opacity: .6;
      cursor: wait;
    }

    .switch {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin-top: 21px;
    }

    .link {
      color: var(--gold-light);
      background: none;
      border: 0;
      padding: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    #message {
      display: none;
      padding: 12px;
      margin-top: 18px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.info {
      display: block;
      background: #242016;
      color: var(--gold-light);
    }

    #message.error {
      display: block;
      background: #351919;
      color: #ffb7b7;
    }

    #message.success {
      display: block;
      background: #15301e;
      color: #b8f3c9;
    }

    .back {
      display: block;
      margin-top: 23px;
      text-align: center;
      color: var(--gold-light);
      text-decoration: none;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      padding: 22px 12px;
      border-top: 1px solid #29251b;
      line-height: 1.7;
    }

    @media (max-width: 360px) {
      .card { padding: 24px 16px; }
      .brand { font-size: 19px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">REAL WEALTH EDGE</div>
    <div class="tagline">Building Opportunities. Empowering Financial Growth.</div>
  </header>

  <main>
    <section class="card">
      <h1 id="formTitle">Member Login</h1>
      <p class="intro" id="formIntro">
        Sign in to access your REAL WEALTH EDGE account.
      </p>

      <form id="authForm">
        <label for="email">Email Address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            minlength="6"
            required
          >
          <button class="show-password" type="button" id="togglePassword">
            Show
          </button>
        </div>

        <button class="primary" id="submitButton" type="submit">
          Login
        </button>
      </form>

      <div id="message" role="status" aria-live="polite"></div>

      <div class="switch">
        <span id="switchText">Don't have an account?</span>
        <button class="link" type="button" id="switchMode">
          Create Account
        </button>
      </div>

      <div class="switch" id="forgotWrap">
        <button class="link" type="button" id="forgotPassword">
          Forgot Password?
        </button>
      </div>

      <a class="back" href="index.html">← Back to Homepage</a>
    </section>
  </main>

  <footer>
    &copy; <span id="year"></span> REAL WEALTH EDGE.
    All rights reserved.
    <br>
    Investment involves risk. Returns are not guaranteed.
  </footer>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://ilbqpcqlqnwtukrzsqjq.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "PASTE_YOUR_PUBLIC_ANON_KEY_HERE";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const authForm = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const formTitle = document.getElementById("formTitle");
    const formIntro = document.getElementById("formIntro");
    const switchText = document.getElementById("switchText");
    const switchMode = document.getElementById("switchMode");
    const forgotWrap = document.getElementById("forgotWrap");

    let isRegistering = false;

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "";
    }

    document.getElementById("togglePassword").addEventListener(
      "click", function () {
        const showing = passwordInput.type === "text";
        passwordInput.type = showing ? "password" : "text";
        this.textContent = showing ? "Show" : "Hide";
      }
    );

    switchMode.addEventListener("click", function () {
      isRegistering = !isRegistering;
      clearMessage();

      formTitle.textContent = isRegistering
        ? "Create Your Account" : "Member Login";

      formIntro.textContent = isRegistering
        ? "Register with your email address and create a secure password."
        : "Sign in to access your REAL WEALTH EDGE account.";

      submitButton.textContent = isRegistering
        ? "Create Account" : "Login";

      switchText.textContent = isRegistering
        ? "Already registered?" : "Don't have an account?";

      switchMode.textContent = isRegistering
        ? "Login" : "Create Account";

      passwordInput.autocomplete = isRegistering
        ? "new-password" : "current-password";

      forgotWrap.style.display = isRegistering ? "none" : "block";
    });

    authForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      clearMessage();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!SUPABASE_PUBLISHABLE_KEY ||
          SUPABASE_PUBLISHABLE_KEY === "PASTE_YOUR_PUBLIC_ANON_KEY_HERE") {
        showMessage(
          "Setup is incomplete. Add your Supabase public anon key to the code first.",
          "error"
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = isRegistering
        ? "Creating Account..." : "Signing In...";

      try {
        if (isRegistering) {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: window.location.href
            }
          });

          if (error) throw error;

          if (data.session) {
            showMessage(
              "Your account was created and you are signed in. The member dashboard has not been built yet.",
              "success"
            );
          } else {
            showMessage(
              "Registration received. Check your email for the confirmation link before logging in.",
              "success"
            );
          }
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          showMessage(
            "Login successful. Your account is authenticated, but the member dashboard has not been built yet.",
            "success"
          );
        }
      } catch (error) {
        showMessage(
          error.message || "Something went wrong. Please try again.",
          "error"
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = isRegistering
          ? "Create Account" : "Login";
      }
    });

    document.getElementById("forgotPassword").addEventListener(
      "click", async function () {
        clearMessage();

        const email = emailInput.value.trim();

        if (!email) {
          showMessage(
            "Enter your email address above first, then tap Forgot Password again.",
            "info"
          );
          emailInput.focus();
          return;
        }

        try {
          const { error } = await supabase.auth.resetPasswordForEmail(
            email,
            {
              redirectTo: window.location.origin +
                window.location.pathname
            }
          );

          if (error) throw error;

          showMessage(
            "If an account exists for that email, a password-reset link will be sent. Check your inbox.",
            "success"
          );
        } catch (error) {
          showMessage(
            error.message || "Could not request a password reset.",
            "error"
          );
        }
      }
    );
  </script>
</body>
  </html>
