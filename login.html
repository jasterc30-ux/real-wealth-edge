
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b70">
  <meta name="description" content="Secure member access to REAL WEALTH EDGE.">
  <title>Member Access | REAL WEALTH EDGE</title>

  <style>
    :root {
      --navy: #123b70;
      --blue: #1769d2;
      --light-blue: #eaf3ff;
      --white: #ffffff;
      --text: #17263b;
      --muted: #64748b;
      --border: #d6e1ef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #edf5ff, #fff 65%);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--navy);
      color: #fff;
      padding: 24px 16px;
      text-align: center;
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    .tagline {
      color: #d9e9ff;
      font-size: 12px;
      margin-top: 8px;
    }

    main {
      width: 100%;
      max-width: 470px;
      margin: auto;
      padding: 36px 18px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px 24px;
      box-shadow: 0 14px 40px #123b7010;
    }

    .logo-mark {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--light-blue);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 26px;
      font-weight: bold;
    }

    h1 {
      font-size: 27px;
      text-align: center;
      margin: 0 0 10px;
      color: var(--navy);
    }

    .intro {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      text-align: center;
      margin: 0 0 25px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #1769d218;
    }

    .password-wrap {
      display: flex;
      gap: 8px;
    }

    .password-wrap input {
      min-width: 0;
      flex: 1;
    }

    .show-password {
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--light-blue);
      color: var(--navy);
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      background: var(--blue);
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary:hover { background: var(--navy); }
    .primary:disabled { opacity: .65; cursor: wait; }

    .switch {
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .link {
      border: 0;
      padding: 4px;
      background: transparent;
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #message.info {
      display: block;
      background: var(--light-blue);
      color: var(--navy);
    }

    #message.success {
      display: block;
      background: #e9f8ef;
      color: #167547;
    }

    #message.error {
      display: block;
      background: #fff0ef;
      color: #b42318;
    }

    .back {
      display: block;
      margin-top: 23px;
      text-align: center;
      color: var(--blue);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    footer {
      background: #f5f8fc;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      padding: 22px 14px;
      font-size: 12px;
      line-height: 1.8;
    }

    @media (max-width: 380px) {
      .brand { font-size: 19px; }
      .card { padding: 25px 17px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">REAL WEALTH EDGE</div>
    <div class="tagline">
      Building Opportunities. Empowering Financial Growth.
    </div>
  </header>

  <main>
    <section class="card">
      <div class="logo-mark" aria-hidden="true">R</div>

      <h1 id="formTitle">Member Login</h1>

      <p class="intro" id="formIntro">
        Welcome back. Sign in to access your member account.
      </p>

      <form id="authForm">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          name="email"
          placeholder="Enter your email address"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>

        <div class="password-wrap">
          <input
            id="password"
            type="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            minlength="6"
            required
          >

          <button
            class="show-password"
            type="button"
            id="togglePassword"
          >Show</button>
        </div>

        <button class="primary" id="submitButton" type="submit">
          Login
        </button>
      </form>

      <div id="message" role="status" aria-live="polite"></div>

      <div class="switch">
        <span id="switchText">New to REAL WEALTH EDGE?</span>
        <button class="link" type="button" id="switchMode">
          Create Account
        </button>
      </div>

      <div class="switch" id="forgotWrap">
        <button class="link" type="button" id="forgotPassword">
          Forgot Password?
        </button>
      </div>

      <a class="back" href="index.html">← Return to Homepage</a>
    </section>
  </main>

  <footer>
    &copy; <span id="year"></span> REAL WEALTH EDGE. All rights reserved.
    <br>
    Investment involves risk. Returns are not guaranteed.
  </footer>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://ilbqpcqlqnwtukrzsqjq.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsYnFwY3FscW53dHVrcnpzcWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDAxOTUsImV4cCI6MjEwNzk3NjE5NX0.86g5_hBhM00fJurSIlZgMxHZYrtW3sAGknIZHJQmqWY";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const formTitle = document.getElementById("formTitle");
    const formIntro = document.getElementById("formIntro");
    const switchText = document.getElementById("switchText");
    const switchMode = document.getElementById("switchMode");
    const forgotWrap = document.getElementById("forgotWrap");

    let isRegistering = false;

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "";
    }

    document.getElementById("togglePassword").addEventListener(
      "click", function () {
        const showing = passwordInput.type === "text";
        passwordInput.type = showing ? "password" : "text";
        this.textContent = showing ? "Show" : "Hide";
      }
    );

    switchMode.addEventListener("click", function () {
      isRegistering = !isRegistering;
      clearMessage();

      formTitle.textContent = isRegistering
        ? "Create Your Account" : "Member Login";

      formIntro.textContent = isRegistering
        ? "Enter your email and create a password to register."
        : "Welcome back. Sign in to access your member account.";

      submitButton.textContent = isRegistering
        ? "Create Account" : "Login";

      switchText.textContent = isRegistering
        ? "Already have an account?" : "New to REAL WEALTH EDGE?";

      switchMode.textContent = isRegistering ? "Login" : "Create Account";

      passwordInput.autocomplete = isRegistering
        ? "new-password" : "current-password";

      forgotWrap.style.display = isRegistering ? "none" : "block";
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      clearMessage();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      submitButton.disabled = true;
      submitButton.textContent = isRegistering
        ? "Creating Account..." : "Signing In...";

      try {
        if (isRegistering) {
          const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password
          });

          if (error) throw error;

          if (data.session) {
            showMessage(
              "Your account was created successfully. The member dashboard is not available yet.",
              "success"
            );
          } else {
            showMessage(
              "Registration received. Check your email for a confirmation link before logging in.",
              "success"
            );
          }
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (error) throw error;

          showMessage(
            "Login successful. The member dashboard is still being developed.",
            "success"
          );
        }
      } catch (error) {
        showMessage(
          error.message || "Something went wrong. Please try again.",
          "error"
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = isRegistering
          ? "Create Account" : "Login";
      }
    });

    document.getElementById("forgotPassword").addEventListener(
      "click", async function () {
        clearMessage();

        const email = emailInput.value.trim();

        if (!email) {
          showMessage(
            "Enter your email address first, then tap Forgot Password again.",
            "info"
          );
          emailInput.focus();
          return;
        }

        try {
          const { error } =
            await supabase.auth.resetPasswordForEmail(email, {
              redirectTo: window.location.origin +
                window.location.pathname
            });

          if (error) throw error;

          showMessage(
            "If an account exists for that email, a password-reset email will be sent. Check your inbox.",
            "success"
          );
        } catch (error) {
          showMessage(
            error.message || "Unable to request a password reset.",
            "error"
          );
        }
      }
    );
  </script>
</body>
</html>
