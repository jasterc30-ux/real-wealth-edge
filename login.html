
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1426">
  <title>Login | REAL WEALTH EDGE</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #0b1426;
      color: white;
    }

    header {
      padding: 22px 18px;
      border-bottom: 1px solid #26344c;
    }

    .brand {
      color: #f4c45e;
      font-size: 18px;
      font-weight: bold;
    }

    main {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 35px 22px;
    }

    .panel {
      background: #111e33;
      border: 1px solid #30415b;
      border-radius: 12px;
      padding: 28px 22px;
    }

    h1 { margin-top: 0; font-size: 28px; }

    .intro {
      color: #bdc8da;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #40516c;
      border-radius: 6px;
      background: #0b1426;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: #f4c45e;
      color: #101a2c;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
    }

    .notice {
      margin-top: 18px;
      color: #bdc8da;
      font-size: 12px;
      line-height: 1.6;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #f4c45e;
      text-decoration: none;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #aab6c9;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">REAL WEALTH EDGE</div>
  </header>

  <main>
    <section class="panel">
      <h1>Welcome Back</h1>
      <p class="intro">
        Sign-in page for the REAL WEALTH EDGE platform.
      </p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          autocomplete="username"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        >

        <button type="submit">Log In</button>
      </form>

      <p class="notice" id="notice">
        This is a visual prototype. Account sign-in is not connected yet.
        Do not enter a real password.
      </p>

      <a class="back" href="index.html">Back to Home</a>
    </section>
  </main>

  <footer>
    &copy; 2026 REAL WEALTH EDGE
  </footer>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("notice").textContent =
        "This demo is not connected to an account system yet. No login was performed.";
    });
  </script>
</body>
</html>
